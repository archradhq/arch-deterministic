# Fixture for archrad scan (compose extractor): gateway (api) → postgres + redis
services:
  api:
    image: mycompany/api:latest
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:5432/appdb

  postgres:
    image: postgres:15

  redis:
    image: redis:7-alpine

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
