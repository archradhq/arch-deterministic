# Poetry layout: dependencies are table KEYS with version constraints as values,
# not an array of requirement strings.
[tool.poetry]
name = "billing-worker"
version = "0.3.0"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2"
asyncpg = "^0.29"
aioredis = "^2.0"

# Dev dependencies are not runtime infrastructure and are not read.
[tool.poetry.group.dev.dependencies]
pymongo = "^4.0"
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
